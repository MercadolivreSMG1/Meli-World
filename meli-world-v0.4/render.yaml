# Blueprint do Render (render.com) — servidor multiplayer do MELI WORLD no plano GRÁTIS.
# No Render: New → Blueprint → escolha este repositório. Ele pede o DATABASE_URL (banco Neon grátis).
services:
  - type: web
    name: meli-world
    runtime: node
    plan: free
    rootDir: meli-world-github
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ROOM_MAX
        value: "30"
      # cole aqui a connection string do Neon (postgresql://...); sem ela o progresso some quando o Render reinicia
      - key: DATABASE_URL
        sync: false
