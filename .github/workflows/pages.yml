# Publica o MELI WORLD no GitHub Pages (modo solo, sem servidor).
# O projeto está na pasta meli-world-github/ deste repositório.
name: Deploy MELI WORLD no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meli-world-github
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SERVER_URL: ${{ secrets.GAME_SERVER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: meli-world-github/client/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
