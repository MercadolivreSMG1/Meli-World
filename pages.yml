# Publica o jogo no GitHub Pages.
# Sem configurar nada, o jogo roda no MODO SOLO (tudo no navegador).
# Opcional: para oferecer multiplayer, hospede o servidor (Render, Railway, Fly.io, Fury…) e crie o
# secret GAME_SERVER_URL com o endereço, por exemplo: wss://meli-world.onrender.com
name: Deploy cliente no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SERVER_URL: ${{ secrets.GAME_SERVER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
